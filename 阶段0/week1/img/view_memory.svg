<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5"/></marker></defs>
<rect width="680" height="330" fill="#ffffff"/>
<g fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8">
<rect x="60" y="30" width="200" height="56" rx="8"/>
<rect x="420" y="30" width="200" height="56" rx="8"/>
</g>
<g text-anchor="middle" dominant-baseline="central">
<text x="160" y="50" font-size="14" font-weight="600" fill="#3C3489">a = np.arange(6)</text>
<text x="160" y="70" font-size="12" fill="#534AB7">header: shape (6,)</text>
<text x="520" y="50" font-size="14" font-weight="600" fill="#3C3489">b = a.reshape(2, 3)</text>
<text x="520" y="70" font-size="12" fill="#534AB7">header: shape (2, 3)</text>
</g>
<path d="M160 86 L160 110 L290 110 L290 140" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#ar)"/>
<path d="M520 86 L520 110 L390 110 L390 140" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#ar)"/>
<text x="340" y="132" font-size="12" fill="#5F5E5A" text-anchor="middle">same buffer</text>
<g stroke="#0F6E56" stroke-width="0.8">
<rect x="220" y="145" width="40" height="36" fill="#FAEEDA" stroke="#854F0B"/>
<rect x="260" y="145" width="40" height="36" fill="#E1F5EE"/>
<rect x="300" y="145" width="40" height="36" fill="#E1F5EE"/>
<rect x="340" y="145" width="40" height="36" fill="#E1F5EE"/>
<rect x="380" y="145" width="40" height="36" fill="#E1F5EE"/>
<rect x="420" y="145" width="40" height="36" fill="#E1F5EE"/>
</g>
<g font-size="13" text-anchor="middle" dominant-baseline="central" fill="#085041">
<text x="240" y="163" fill="#633806">100</text><text x="280" y="163">1</text><text x="320" y="163">2</text>
<text x="360" y="163">3</text><text x="400" y="163">4</text><text x="440" y="163">5</text>
</g>
<text x="340" y="200" font-size="12" fill="#5F5E5A" text-anchor="middle">memory (data buffer): b[0, 0] = 100 writes cell 0</text>
<g font-size="13" fill="#2C2C2A">
<text x="60" y="245">a reads it as</text>
<text x="60" y="268" font-family="Consolas, monospace">[100 1 2 3 4 5]</text>
<text x="420" y="245">b reads it as</text>
<text x="420" y="268" font-family="Consolas, monospace">[[100 1 2]</text>
<text x="420" y="288" font-family="Consolas, monospace"> [  3 4 5]]</text>
</g>
<text x="340" y="318" font-size="12" fill="#5F5E5A" text-anchor="middle">One buffer, two headers: values are shared, shapes are not.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
